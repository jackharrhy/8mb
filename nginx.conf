worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/wasm image/svg+xml application/json;

    map $uri $cache_control {
        default "no-cache";
        ~^/8mb/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        absolute_redirect off;
        add_header Cache-Control $cache_control always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;

        location = / { return 302 /8mb/; }
        location = /8mb { return 308 /8mb/$is_args$args; }
        location /8mb/ { try_files $uri $uri/ =404; }
        location / { return 404; }
    }
}
